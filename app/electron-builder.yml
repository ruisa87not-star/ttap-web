appId: io.ttap.planner
productName: TTAP Planner
asar: true
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**
  - package.json
  - LICENSE
  - UPSTREAM.md
  - THIRD_PARTY_NOTICES.txt
  - src/assets/fork-logo.png
  - '!node_modules/**'
win:
  icon: src/assets/fork-logo.png
  target: dir
  executableName: TTAP-Planner
nsis:
  artifactName: TTAP-Planner-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TTAP Planner
  runAfterFinish: false
  deleteAppDataOnUninstall: false
